[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-core"
version = "0.1.0"
description = "Local-first persistent project brain tooling"
readme = "docs/README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI Codex"}]
dependencies = []

[project.scripts]
brain = "project_brain.cli:main"

[tool.setuptools]
packages = ["project_brain", "project_brain.validators"]
