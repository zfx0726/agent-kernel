doc_type: decision_record
fields:
  schema_version:
    type: string
    required: true
  doc_type:
    type: string
    required: true
    enum:
      - decision_record
  decision_id:
    type: string
    required: true
  title:
    type: string
    required: true
  status:
    type: string
    required: true
    enum:
      - proposed
      - accepted
      - superseded
      - rejected
  date:
    type: date
    required: true
  owners:
    type: list[string]
    required: true
  supersedes:
    type: list[string]
    required: false
  superseded_by:
    type: string
    required: false
  related_tasks:
    type: list[string]
    required: true
  related_docs:
    type: list[string]
    required: true
required_headings:
  - "## Context"
  - "## Decision"
  - "## Consequences"
  - "## Alternatives Considered"
  - "## References"
